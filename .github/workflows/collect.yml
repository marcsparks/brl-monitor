name: collect
on:
  schedule:
    - cron: "0 9 * * *"    # daily 09:00 UTC (06:00 São Paulo)
    - cron: "0 21 * * *"   # and 21:00 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "also run one-time history backfill"
        required: false
        default: "no"
      volumes_pages:
        description: "volumes scan page cap per chain (blank = 40)"
        required: false
        default: ""
      volumes_days:
        description: "force volumes re-backfill this many days (blank = incremental)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill (manual only)
        if: ${{ github.event.inputs.backfill == 'yes' }}
        run: python collector/backfill.py
      - name: Collect
        run: python collector/collect.py
      - name: Volumes scan
        env:
          VOLUMES_PAGE_CAP: ${{ github.event.inputs.volumes_pages }}
        run: |
          cd collector
          if [ -n "${{ github.event.inputs.volumes_days }}" ]; then
            python volumes.py --backfill-days "${{ github.event.inputs.volumes_days }}"
          else
            python volumes.py
          fi
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "brl-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F_%H:%M)"
          git push
