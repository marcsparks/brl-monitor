name: collect
on:
  schedule:
    - cron: "0 9 * * *"    # daily 09:00 UTC (06:00 São Paulo)
    - cron: "0 21 * * *"   # and 21:00 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "also run one-time history backfill"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill (manual only)
        if: ${{ github.event.inputs.backfill == 'yes' }}
        run: python collector/backfill.py
      - name: Collect
        run: python collector/collect.py
      - name: Commit data
        run: |
          git config user.name "brl-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F_%H:%M)"
          git push
